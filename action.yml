name: AI Code Quality Auditor
description: >
  Score the code in your repository on security-vulnerability density,
  cyclomatic complexity, duplication and — with a spec — scope drift, and
  optionally fail the build. Runs on the checked-out tree; no capture,
  no setup.

author: O'Rume Dominic Uririe

branding:
  icon: shield
  color: purple

# This action used to call `auditor experiment --conditions ...`. There has
# never been a --conditions option, so every run of it exited 2 on the first
# command. It also required a pre-captured session under data/raw/<run-id>/,
# which is not a thing a CI job has — the README told people to pass
# github.run_id, which could never name one. The action now does what a CI
# user actually wants and what the CLI actually supports: scan the code that
# was just checked out.

inputs:
  path:
    description: Directory to audit, relative to the workspace.
    required: false
    default: "."
  spec:
    description: >
      Optional path to a spec YAML declaring what was asked for. Supplying it
      turns on the scope-drift check, which is the metric this tool exists for.
      Without it the other metrics still run and scope drift reports n/a.
    required: false
    default: ""
  fail-on:
    description: >
      Severity at which to fail the build — never, warn or critical. The
      default is "never", so adding this action cannot break a pipeline on the
      day it is added. Tighten it once you have seen a baseline.
    required: false
    default: never
  decision-record:
    description: Path to write an immutable JSON snapshot of the findings to.
    required: false
    default: auditor-report.json
  version:
    description: Version of ai-code-quality-auditor to install.
    required: false
    default: "0.5.2"
  python-version:
    description: Python interpreter version.
    required: false
    default: "3.11"

outputs:
  report-json:
    description: Path to the JSON decision record.
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install auditor
      shell: bash
      run: pip install --upgrade "ai-code-quality-auditor==${{ inputs.version }}"

    - name: Scan
      id: scan
      shell: bash
      env:
        AUDITOR_PATH: ${{ inputs.path }}
        AUDITOR_SPEC: ${{ inputs.spec }}
        AUDITOR_FAIL_ON: ${{ inputs.fail-on }}
        AUDITOR_RECORD: ${{ inputs.decision-record }}
      run: |
        set -o pipefail
        args=("$AUDITOR_PATH" --fail-on "$AUDITOR_FAIL_ON"
              --decision-record "$AUDITOR_RECORD" --no-history)
        if [ -n "$AUDITOR_SPEC" ]; then
          args+=(--spec "$AUDITOR_SPEC")
        else
          echo "::notice::No spec supplied, so scope drift reports n/a. Pass spec: to score what was built against what was asked for."
        fi
        echo "report=$AUDITOR_RECORD" >> "$GITHUB_OUTPUT"
        # Render to the job summary whether or not the gate trips, then let
        # the gate's own exit code decide the build.
        status=0
        auditor scan "${args[@]}" | tee /tmp/auditor.txt || status=$?
        {
          echo '### AI Code Quality Auditor'
          echo '```'
          cat /tmp/auditor.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status

    - name: Upload the decision record
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: auditor-report
        path: ${{ inputs.decision-record }}
        if-no-files-found: warn
