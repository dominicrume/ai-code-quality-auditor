[project]
name = "ai-code-quality-auditor"
dynamic = ["version"]
description = "Checks whether an AI coding agent built what you asked for: per feature, what was delivered, what is missing, what exists but nothing can reach, with a file and line for every claim."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "O'Rume Dominic Uririe", email = "admin@veritaport.co.uk" }]
requires-python = ">=3.11"
# "sonarcloud" was here until 0.6.0 and had been wrong since the metric moved
# to a local Bandit scan: a keyword is a promise about what the package does.
keywords = ["ai", "code-quality", "llm", "agents", "evaluation", "audit",
            "scope-drift", "specification", "code-review", "static-analysis",
            "governance", "ai-agents", "claude-code", "cursor", "copilot",
            "security", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Environment :: Console",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
  "radon>=6.0",
  "python-dotenv>=1.0",
  "bandit>=1.8",
  # `auditor live` is the primary entry point; a user should never have to
  # know about extras to run the command the docs open with.
  "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "build>=1.2",
       "twine>=5.0", "setuptools>=68", "flask>=3.0", "cryptography>=43.0"]
notebook = ["pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "jupyter>=1.0",
            "statsmodels>=0.14", "scikit-posthocs>=0.9", "scikit-learn>=1.4"]
dashboard = ["flask>=3.0"]
recorder = ["pynput>=1.7"]
seal = ["cryptography>=43.0"]
all = ["pytest>=8.0", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7",
       "jupyter>=1.0", "statsmodels>=0.14", "scikit-posthocs>=0.9",
       "scikit-learn>=1.4", "flask>=3.0", "pynput>=1.7",
       "cryptography>=43.0"]

[project.urls]
Homepage      = "https://github.com/dominicrume/ai-code-quality-auditor"
Repository    = "https://github.com/dominicrume/ai-code-quality-auditor"
Issues        = "https://github.com/dominicrume/ai-code-quality-auditor/issues"
Documentation = "https://github.com/dominicrume/ai-code-quality-auditor/tree/main/docs"
Changelog     = "https://github.com/dominicrume/ai-code-quality-auditor/blob/main/CHANGELOG.md"
Security      = "https://github.com/dominicrume/ai-code-quality-auditor/blob/main/SECURITY.md"
"Privacy"     = "https://github.com/dominicrume/ai-code-quality-auditor/blob/main/docs/PRIVACY.md"
"Live demo"   = "https://auditor-dashboard-rume.fly.dev/report/main_001_plus_human"

[project.scripts]
auditor = "auditor.core.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "auditor._version.__version__" }

[tool.setuptools.packages.find]
include = ["auditor*"]
# `include` is already an allowlist, so nothing outside `auditor*` can be
# discovered. `exclude` is kept as a second statement of intent: it is the line
# someone reads when they widen `include`, and `service*` is named here because
# service/ is a separately deployed app that depends on this package — picking
# it up would make the distribution depend on itself.
exclude = ["tests*", "data*", "scripts*", "docs*", "specs*",
           "service*", "install*", "build*", "dist*"]

[tool.setuptools.package-data]
# The "Typing :: Typed" classifier is a promise a type checker reads literally:
# without this marker, a downstream mypy run ignores every annotation in the
# package while the classifier says they are there.
"auditor" = ["py.typed"]
"auditor.dashboard" = ["templates/*.html", "static/*"]
"auditor.assets" = ["*.css"]
"auditor.live" = ["templates/*.html"]
"auditor.standards" = ["*.yaml"]

[tool.pytest.ini_options]
# service/tests covers the sealing service, which is the paid path. It lives
# outside tests/ because the service deploys separately, and it was invisible
# to CI until it was named here.
testpaths = ["tests", "service/tests"]
addopts = "-ra"
