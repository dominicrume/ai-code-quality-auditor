# How a third party consumes the auditor as a GitHub Action.
# Copy this file into your own repo at .github/workflows/auditor.yml.
#
# It also runs here, against this repository, on every push. That is
# deliberate: an integration nobody runs is an integration nobody notices is
# broken. This file previously passed `conditions:` and a `run-id` naming a
# captured session, neither of which the tool has ever supported, and it had
# been failing on its first command since it was written.
name: Audit AI-generated code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dominicrume/ai-code-quality-auditor@main
        with:
          path: auditor
          spec: specs/agent_education_system.yaml
          # This repository is the instrument, not a deliverable built to that
          # spec, so scope drift against it is not meaningful here and the gate
          # stays advisory. In your repo, point spec: at what you asked for and
          # raise this to critical once you have a baseline.
          fail-on: never
