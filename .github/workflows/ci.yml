name: CI
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ".[dashboard]" does not bring pytest, so the Tests step below exited
      # 127 with "pytest: command not found" on every run this workflow has
      # ever had. It was a required status check on main the whole time,
      # which is worse than having no check: it reported green protection
      # that did not exist. The test extras are now installed explicitly.
      - name: Install (test, dashboard, notebook and recorder extras)
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev,all]" "pynput==1.8.2"
      # Enforced narrowly and honestly. The full default ruff ruleset reports
      # 234 findings on this tree, almost all stylistic; a step that ends in
      # "|| true" is not a gate, it is decoration. These rules catch real
      # defects — undefined names, unreachable code, mutable default
      # arguments — and the tree is clean against them today, so a
      # regression fails the build.
      - name: Lint (correctness rules, enforced)
        run: ruff check . --select E9,F63,F7,F82,F811,B006
      - name: Lint (full ruleset, advisory)
        run: ruff check . --statistics || true
      - name: Tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=dominicrume_ai-code-quality-auditor
            -Dsonar.organization=dominicrume
