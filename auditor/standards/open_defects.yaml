# Defects known open in this instrument, machine-readable, shipped in the wheel.
#
# Every receipt embeds this list at the moment it is built. A verdict whose
# known weakness is invisible to whoever relies on it is not an attestation,
# whatever it is signed with, so the disclosure travels with the artefact rather
# than living in a document the reader has to go and find.
#
# docs/FINDING_*.md and docs/ERRATUM_*.md remain the record of account. They are
# excluded from the wheel, which is why this file exists. A test fails if any
# record there is marked open and is missing here.
#
# Convention: add an entry the moment a defect is recorded, remove it when the
# record's status line says it is fixed.

open:
  - id: FINDING_008
    summary: >
      The duplication metric counts a project's built assets against their own
      source tree, so a repository that ships both reports duplication it does
      not have, and that one reading can set the worst band for a whole audit.
    affects: >
      Duplication percentages on any repository shipping built assets beside
      their source may be substantially overstated. Read the duplicated paths
      before quoting the figure. Security counts are also doubled where a
      finding appears in both trees.
    recorded: "2026-11-23"

# Nothing is open. FINDING_004 was the last entry and was closed on
# 23 November 2026; see docs/FINDING_004_fidelity_reads_its_own_vocabulary.md.
# An empty list is a claim in its own right, and it is only worth anything
# because the records in docs/ are checked against it by
# tests/test_receipts.py::test_every_open_defect_record_is_declared_in_the_shipped_list.

