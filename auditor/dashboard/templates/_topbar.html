{#- The sticky header, identical on every page, with the theme switch. -#}
<header class="topbar no-print">
  <div class="topbar-inner">
    <a class="brand" href="/" style="text-decoration:none;color:inherit">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>AI Code Quality Auditor
        <small>{{ subtitle|default('Specification fidelity for generated code') }}</small>
      </span>
    </a>
    <div class="row">
      {% if nav_meta %}<span class="mono muted" style="font-size:.78rem">{{ nav_meta }}</span>{% endif %}
      <div class="theme-toggle" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light" title="Light" aria-pressed="false">☀</button>
        <button type="button" data-theme-set="dark"  title="Dark"  aria-pressed="false">☾</button>
      </div>
    </div>
  </div>
</header>
